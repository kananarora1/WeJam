# Local settings live in backend/.env (gitignored; copy .env.example). KEY=value lines are valid properties.
# Real OS environment variables still win over the file.
spring.config.import=optional:file:./.env[.properties]

spring.application.name=WeJam

spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/wejam}
spring.datasource.username=${DB_USER:wejam}
spring.datasource.password=${DB_PASSWORD:wejam}

# Flyway owns the schema; Hibernate only verifies entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Fail fast on lazy loading outside the service layer instead of silently issuing queries.
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

management.endpoints.web.exposure.include=health
# Anonymous callers see only UP/DOWN; any authenticated user sees per-component details.
management.endpoint.health.show-details=when-authorized

wejam.jwt.issuer=wejam
wejam.jwt.ttl=1h
# Required, >= 32 chars. Local: export JWT_SECRET=$(openssl rand -base64 48)
wejam.jwt.secret=${JWT_SECRET}
# Accept fake "fake:<uid>[:<phone>]" Firebase tokens. Local dev/tests only.
wejam.auth.fake-firebase=${WEJAM_AUTH_FAKE_FIREBASE:false}
# Required when fake-firebase=false. Credentials: GOOGLE_APPLICATION_CREDENTIALS=<path to service-account JSON>
wejam.firebase.project-id=${FIREBASE_PROJECT_ID:}
wejam.firebase.credentials-file=${GOOGLE_APPLICATION_CREDENTIALS:}

# OpenAPI spec (/v3/api-docs) + Swagger UI (/swagger-ui.html). Set SPRINGDOC_ENABLED=false to hide in real deployments.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
# 3.0 has better Dart generator support than 3.1.
springdoc.api-docs.version=openapi_3_0
# Stable key order keeps docs/api/openapi.yaml diffs meaningful.
springdoc.writer-with-order-by-keys=true
# Only the public API belongs in the client contract.
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json

# Comma-separated E.164 phone numbers that are platform admins (granted at login, revoked when removed).
wejam.admin.phones=${WEJAM_ADMIN_PHONES:}
