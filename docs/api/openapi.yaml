openapi: 3.0.1
info:
  title: WeJam API
  version: v1
servers:
- description: Local development
  url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /api/v1/auth/token:
    post:
      operationId: exchange
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
      security: []
      tags:
      - Auth
  /api/v1/host-profiles/{profileId}:
    get:
      operationId: getHostProfile
      parameters:
      - in: path
        name: profileId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostProfileResponse"
          description: OK
      tags:
      - Hosts
  /api/v1/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
      tags:
      - Me
    patch:
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
      tags:
      - Me
  /api/v1/me/host-profile:
    get:
      operationId: getMyHostProfile
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostProfileResponse"
          description: OK
      tags:
      - Hosts
    put:
      operationId: saveMyHostProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostProfileRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostProfileResponse"
          description: OK
      tags:
      - Hosts
  /api/v1/me/roles:
    post:
      operationId: addRole
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRoleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
      tags:
      - Me
  /api/v1/me/venues:
    get:
      operationId: myVenues
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VenueSummary"
          description: OK
      tags:
      - Venues
  /api/v1/venues:
    post:
      operationId: createVenue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueResponse"
          description: Created
      tags:
      - Venues
  /api/v1/venues/{venueId}:
    delete:
      operationId: deleteVenue
      parameters:
      - in: path
        name: venueId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      tags:
      - Venues
    get:
      operationId: getVenue
      parameters:
      - in: path
        name: venueId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueResponse"
          description: OK
      tags:
      - Venues
    put:
      operationId: updateVenue
      parameters:
      - in: path
        name: venueId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueResponse"
          description: OK
      tags:
      - Venues
  /api/v1/venues/{venueId}/spaces:
    post:
      operationId: createSpace
      parameters:
      - in: path
        name: venueId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceResponse"
          description: Created
      tags:
      - Venues
  /api/v1/venues/{venueId}/spaces/{spaceId}:
    delete:
      operationId: deleteSpace
      parameters:
      - in: path
        name: venueId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: spaceId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      tags:
      - Venues
    put:
      operationId: updateSpace
      parameters:
      - in: path
        name: venueId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: spaceId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceResponse"
          description: OK
      tags:
      - Venues
components:
  schemas:
    AddRoleRequest:
      type: object
      properties:
        role:
          type: string
          description: Only HOST or VENUE_ADMIN are accepted
          enum:
          - USER
          - HOST
          - VENUE_ADMIN
      required:
      - role
    HostProfileRequest:
      type: object
      properties:
        area:
          type: string
          example: Indiranagar
          maxLength: 80
          minLength: 0
          nullable: true
        bio:
          type: string
          example: Four friends running slow blues nights in Indiranagar since 2024.
          maxLength: 200
          minLength: 0
          nullable: true
        genres:
          type: array
          items:
            type: string
            enum:
            - BLUES
            - JAZZ
            - ROCK
            - INDIE
            - POP
            - FOLK
            - SOUL
            - FUNK
            - SUFI
            - BOLLYWOOD
            - INDIAN_CLASSICAL
            - WESTERN_CLASSICAL
            - FUSION
            - HIP_HOP
            - ELECTRONIC
            - METAL
            - ACOUSTIC_COVERS
          maxItems: 5
          minItems: 0
          uniqueItems: true
        groupKind:
          type: string
          description: Required when type is GROUP
          enum:
          - BAND
          - FRIENDS
          - COMMUNITY
          nullable: true
        groupName:
          type: string
          description: Required when type is GROUP
          example: The Low Notes
          maxLength: 80
          minLength: 0
          nullable: true
        instagramHandle:
          type: string
          description: "Instagram username, with or without @"
          example: thelownotes
          nullable: true
          pattern: "@?[A-Za-z0-9._]{1,30}"
        mediaLinks:
          type: array
          items:
            $ref: "#/components/schemas/MediaLinkDto"
          maxItems: 5
          minItems: 0
        type:
          type: string
          enum:
          - INDIVIDUAL
          - GROUP
      required:
      - genres
      - mediaLinks
      - type
    HostProfileResponse:
      type: object
      properties:
        area:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        displayName:
          type: string
          description: "Group name, or the owner's display name for an individual\
            \ (null if not set yet)"
          nullable: true
        genres:
          type: array
          items:
            type: string
            enum:
            - BLUES
            - JAZZ
            - ROCK
            - INDIE
            - POP
            - FOLK
            - SOUL
            - FUNK
            - SUFI
            - BOLLYWOOD
            - INDIAN_CLASSICAL
            - WESTERN_CLASSICAL
            - FUSION
            - HIP_HOP
            - ELECTRONIC
            - METAL
            - ACOUSTIC_COVERS
        groupKind:
          type: string
          enum:
          - BAND
          - FRIENDS
          - COMMUNITY
          nullable: true
        id:
          type: string
          format: uuid
        instagramHandle:
          type: string
          nullable: true
        mediaLinks:
          type: array
          items:
            $ref: "#/components/schemas/MediaLinkDto"
        type:
          type: string
          enum:
          - INDIVIDUAL
          - GROUP
      required:
      - area
      - bio
      - displayName
      - genres
      - groupKind
      - id
      - instagramHandle
      - mediaLinks
      - type
    MeResponse:
      type: object
      properties:
        displayName:
          type: string
          description: Null until the user completes their profile
          nullable: true
        id:
          type: string
          format: uuid
        phone:
          type: string
          description: E.164; null for non-phone sign-in methods
          nullable: true
        roles:
          type: array
          items:
            type: string
            enum:
            - USER
            - HOST
            - VENUE_ADMIN
          uniqueItems: true
      required:
      - displayName
      - id
      - phone
      - roles
    MediaLinkDto:
      type: object
      properties:
        title:
          type: string
          example: Live at Amber Room
          maxLength: 80
          minLength: 0
          nullable: true
        url:
          type: string
          example: https://youtu.be/abc123
          maxLength: 300
          minLength: 0
          pattern: https?://\S+
      required:
      - title
      - url
    SpaceRequest:
      type: object
      properties:
        capacity:
          type: integer
          format: int32
          example: 60
          maximum: 1000
          minimum: 1
        houseRules:
          type: string
          description: Shown on every event at this space
          example: 18+ after 9 PM. Min. spend ₹300 for audience.
          maxLength: 1000
          minLength: 0
          nullable: true
        name:
          type: string
          example: Main floor
          maxLength: 80
          minLength: 0
        soundCurfew:
          type: string
          description: Local time (venue time zone) events here must end by; null
            = no curfew
          example: 23:00
          nullable: true
        soundPolicy:
          type: string
          enum:
          - ACOUSTIC_ONLY
          - AMPLIFIED_ALLOWED
      required:
      - capacity
      - name
      - soundPolicy
    SpaceResponse:
      type: object
      properties:
        capacity:
          type: integer
          format: int32
        houseRules:
          type: string
          nullable: true
        id:
          type: string
          format: uuid
        name:
          type: string
        soundCurfew:
          type: string
          example: 23:00
          nullable: true
        soundPolicy:
          type: string
          enum:
          - ACOUSTIC_ONLY
          - AMPLIFIED_ALLOWED
      required:
      - capacity
      - houseRules
      - id
      - name
      - soundCurfew
      - soundPolicy
    TokenRequest:
      type: object
      properties:
        firebaseIdToken:
          type: string
          minLength: 1
      required:
      - firebaseIdToken
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
          description: Seconds until accessToken expires
        tokenType:
          type: string
          example: Bearer
      required:
      - accessToken
      - expiresIn
      - tokenType
    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 50
          minLength: 0
      required:
      - displayName
    VenueRequest:
      type: object
      properties:
        addressLine:
          type: string
          example: "12th Main, HAL 2nd Stage"
          maxLength: 200
          minLength: 0
        city:
          type: string
          example: Bengaluru
          maxLength: 80
          minLength: 0
        description:
          type: string
          maxLength: 1000
          minLength: 0
          nullable: true
        fssaiNumber:
          type: string
          description: FSSAI license number. Changing it resets verification to PENDING.
          example: "12345678901234"
          pattern: "\\d{14}"
        hostingMode:
          type: string
          enum:
          - OPEN
          - SELF_ONLY
        latitude:
          type: number
          format: double
          example: 12.9784
          exclusiveMaximum: false
          exclusiveMinimum: false
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          example: 77.6408
          exclusiveMaximum: false
          exclusiveMinimum: false
          maximum: 180
          minimum: -180
        name:
          type: string
          example: Amber Room
          maxLength: 80
          minLength: 0
      required:
      - addressLine
      - city
      - fssaiNumber
      - hostingMode
      - latitude
      - longitude
      - name
    VenueResponse:
      type: object
      properties:
        addressLine:
          type: string
        city:
          type: string
        description:
          type: string
          nullable: true
        fssaiNumber:
          type: string
        hostingMode:
          type: string
          enum:
          - OPEN
          - SELF_ONLY
        id:
          type: string
          format: uuid
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        name:
          type: string
        rejectionReason:
          type: string
          nullable: true
        spaces:
          type: array
          items:
            $ref: "#/components/schemas/SpaceResponse"
        verificationStatus:
          type: string
          enum:
          - PENDING
          - VERIFIED
          - REJECTED
      required:
      - addressLine
      - city
      - description
      - fssaiNumber
      - hostingMode
      - id
      - latitude
      - longitude
      - name
      - rejectionReason
      - spaces
      - verificationStatus
    VenueSummary:
      type: object
      properties:
        city:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        spaceCount:
          type: integer
          format: int64
        verificationStatus:
          type: string
          enum:
          - PENDING
          - VERIFIED
          - REJECTED
      required:
      - city
      - id
      - name
      - spaceCount
      - verificationStatus
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
